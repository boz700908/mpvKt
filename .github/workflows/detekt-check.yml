name: Detekt Check
on:
  push:
    branches: ['a11y/detekt']
  workflow_dispatch:
jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - run: chmod +x ./gradlew
      - run: ./gradlew detekt --auto-correct || true
      - name: Export patch
        run: |
          git diff > detekt-fix.patch || true
          wc -l detekt-fix.patch
      - uses: actions/upload-artifact@v4
        with:
          name: detekt-patch
          path: detekt-fix.patch
          if-no-files-found: warn
