name: A11y Build

# Signed release APKs for the accessibility fork.
#
# Release, not debug, and signed with a fixed key from repository secrets: the debug key is
# regenerated on every CI run, so a debug APK can never be installed over the previous one.

on:
  push:
    branches:
      - 'a11y/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mpvkt-release.jks"
          test -s "$RUNNER_TEMP/mpvkt-release.jks"

      - name: Build signed release
        env:
          MPVKT_KEYSTORE: ${{ runner.temp }}/mpvkt-release.jks
          MPVKT_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MPVKT_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          MPVKT_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*-arm64-v8a-release.apk' | head -1)
          echo "checking $APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | head -5

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpvkt-a11y-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
